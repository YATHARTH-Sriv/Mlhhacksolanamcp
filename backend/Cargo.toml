[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
solana-account-decoder-client-types = "4.4.1"
solana-rpc-client = "4.4.1"
solana-sdk = "5.0.0"
spl-token = "9.0.0"
spl-token-2022 = "12.0.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
url = "2.5.8"
sha2 = "0.10"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bincode = "1.3"
solana-message = "5"
solana-transaction = { version = "5", features = ["serde", "verify"] }
solana-instruction = "4"
solana-compute-budget-interface = "3.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
spl-associated-token-account-interface = "2"
schemars = "1"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
